name: Allure Docker Service UI Workflow

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. 3.3.1)"
        required: true
      latest:
        description: "Also tag as latest?"
        type: boolean
        default: true
      create_release:
        description: "Create GitHub Release?"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: intellon/allure-docker-service-ui

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Pulling code
        uses: actions/checkout@v4

      - name: Preparing
        id: prepare
        run: |
          DOCKER_PLATFORMS=linux/amd64,linux/arm64,linux/arm/v7
          VERSION=na
          PUSH=false
          CREATE_RELEASE=false
          TAGS="--tag ${REGISTRY}/${IMAGE_NAME}:na"

          # Manual dispatch
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            PUSH=true
            CREATE_RELEASE="${{ github.event.inputs.create_release }}"
            if [[ "${{ github.event.inputs.latest }}" == "true" ]]; then
              TAGS="--tag ${REGISTRY}/${IMAGE_NAME}:${VERSION} --tag ${REGISTRY}/${IMAGE_NAME}:latest"
            else
              TAGS="--tag ${REGISTRY}/${IMAGE_NAME}:${VERSION}"
            fi
          fi

          # Tag push
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            PUSH=true
            CREATE_RELEASE=true
            if [[ $GITHUB_REF == *"beta"* ]]; then
              TAGS="--tag ${REGISTRY}/${IMAGE_NAME}:${VERSION} --tag ${REGISTRY}/${IMAGE_NAME}:beta"
            else
              TAGS="--tag ${REGISTRY}/${IMAGE_NAME}:${VERSION} --tag ${REGISTRY}/${IMAGE_NAME}:latest"
            fi
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "push=${PUSH}" >> $GITHUB_OUTPUT
          echo "create_release=${CREATE_RELEASE}" >> $GITHUB_OUTPUT
          echo "buildx_args=--platform ${DOCKER_PLATFORMS} \
            --build-arg VERSION=${VERSION} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VCS_REF=${GITHUB_SHA::8} \
            ${TAGS} --file docker/Dockerfile ." >> $GITHUB_OUTPUT

      - name: Setting up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setting up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Building
        run: |
          docker buildx build --output "type=image,push=false" ${{ steps.prepare.outputs.buildx_args }}

      - name: Login to GitHub Container Registry
        if: success() && steps.prepare.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Publishing
        if: success() && steps.prepare.outputs.push == 'true'
        run: |
          docker buildx build --output "type=image,push=true" ${{ steps.prepare.outputs.buildx_args }}

      - name: Inspecting image
        if: always() && steps.prepare.outputs.push == 'true'
        run: |
          docker buildx imagetools inspect ${REGISTRY}/${IMAGE_NAME}:${{ steps.prepare.outputs.version }}

      - name: Create GitHub Release
        if: success() && steps.prepare.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Allure Docker Service UI ${{ steps.prepare.outputs.version }}
          body: |
            ## Docker Image
            ```sh
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.prepare.outputs.version }}
            ```

            **Platforms:** linux/amd64, linux/arm64, linux/arm/v7
          draft: false
          prerelease: ${{ contains(steps.prepare.outputs.version, 'beta') }}
          generate_release_notes: true
